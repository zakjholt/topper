services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: topper
      POSTGRES_PASSWORD: topper
      POSTGRES_DB: topper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
